services:
  postgres:
    image: wai-security/wai-telegram-db:20261023-os
    container_name: wai-telegram-db
    environment:
      POSTGRES_USER: telegram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: telegram_ai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Parallel maintenance workers exchange tuples through /dev/shm. Docker's 64MB
    # default is too small for ANALYZE on telegram_messages, which fails with
    # "could not resize shared memory segment" and leaves autovacuum unable to run.
    shm_size: 512mb
    # One user, and every service pools at most 30 connections, so the default
    # 100 x 16MB of work_mem is headroom nobody uses - and it is exactly what
    # tips this container over during a full pg_dump, which pulls an 8.8GB table
    # through a page cache the cgroup counts against the same limit.
    command: >
      postgres
      -c max_connections=50
      -c work_mem=8MB
      -c shared_buffers=256MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=192MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram -d telegram_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 512M could not hold the working set: autovacuum never completed once and
          # the OOM killer reaped postgres (dmesg, 2026-08-16). The HNSW index alone
          # is 3.9GB, so this is a floor, not a target - raise it with the host.
          # 1536M was raised to 2200M by hand on the box after backups kept dying
          # mid-dump; 2560M codifies that with room, and the command above cuts
          # the worst case that made it necessary.
          memory: 2560M
        reservations:
          memory: 512M

  redis:
    image: wai-security/wai-telegram-redis:20261023-os
    container_name: wai-telegram-redis
    # Redis is the durable Celery broker. Evicting arbitrary keys can lose queued
    # media jobs, so fail writes explicitly instead of silently dropping tasks.
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  postgres_data:
  redis_data:
