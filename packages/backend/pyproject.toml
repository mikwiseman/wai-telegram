[project]
name = "wai-telegram-backend"
version = "0.1.0"
description = "FastAPI backend for Telegram AI Message Manager"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings==2.14.2",
    "PyJWT==2.13.0",  # Replaced python-jose (CVE-2024-33663, CVE-2025-61152)
    "pwdlib[argon2,bcrypt]==0.3.0",
    "cryptography==50.0.0",
    "telethon==1.44.0",
    "cryptg==0.6.0",
    "celery[redis]==5.6.3",
    "redis>=5.2.0",
    "openai==2.53.0",
    "pgvector>=0.3.0",
    "python-multipart==0.0.32",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "slowapi>=0.1.9",  # Rate limiting
    "sentry-sdk[fastapi]>=2.0.0",  # Error tracking
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook]==0.1.7",
    "croniter>=2.0.0",  # Cron expression parsing for digital agents
    "tiktoken>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "fakeredis[lua]>=2.26.0",
    "time-machine>=2.16.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers -v"

[tool.coverage.run]
source = ["app"]
omit = ["app/listener/*", "app/tasks/celery_app.py"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 52

[tool.ruff.lint]
ignore = ["E712"]

[tool.ruff.lint.per-file-ignores]
"app/services/sync_service.py" = ["F821"]
