name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: Standard deploy or the one-time evidence-gated account cutover
        required: true
        type: choice
        options:
          - standard
          - initial-cutover
        default: standard
      media_mode:
        description: Full durable media runtime or an explicit deferred-storage release
        required: true
        type: choice
        options:
          - full
          - deferred
        default: full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  DEPLOY_DIR: /opt/wai-telegram

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-packages --extra dev --frozen
      - name: Lint Python packages
        run: uv run ruff check packages/backend packages/mcp-server
      - name: Format check Python packages
        run: uv run ruff format --check packages/backend packages/mcp-server

  typescript-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json
      - name: Install dependencies
        working-directory: packages/frontend
        run: npm ci
      - name: Lint
        working-directory: packages/frontend
        run: npm run lint
      - name: Type check
        working-directory: packages/frontend
        run: npx tsc --noEmit

  backend-tests:
    runs-on: ubuntu-latest
    needs: [python-lint]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: telegram
          POSTGRES_PASSWORD: telegram_test
          POSTGRES_DB: telegram_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://telegram:telegram_test@localhost:5432/telegram_ai_test
      POSTGRES_CONTRACT_DATABASE_URL: postgresql+asyncpg://telegram:telegram_test@localhost:5432/telegram_ai_test
      REDIS_URL: redis://localhost:6379
      ENVIRONMENT: development
      SECRET_KEY: ci-test-secret-key
      ENCRYPTION_KEY: sZEBNdB1PTJZ8o9vGjJsXnUN9cQXz94O1jSWv7l4hQw=
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: packages/backend
        run: uv sync --extra dev --frozen
      - name: Create pgvector extension
        run: |
          PGPASSWORD=telegram_test psql -h localhost -U telegram -d telegram_ai_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Run migrations
        working-directory: packages/backend
        run: uv run alembic upgrade head
      - name: Run tests
        working-directory: packages/backend
        run: |
          uv run pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results/backend.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: packages/backend/test-results/

  frontend-tests:
    runs-on: ubuntu-latest
    needs: [typescript-lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json
      - name: Install dependencies
        working-directory: packages/frontend
        run: npm ci
      - name: Run tests
        working-directory: packages/frontend
        run: npm run test:coverage
      - name: Production build
        working-directory: packages/frontend
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: Y2ktdGVzdC1zZXJ2ZXItYWN0aW9ucy1rZXk=
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
  mcp-tests:
    runs-on: ubuntu-latest
    needs: [python-lint]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: packages/mcp-server
        run: uv sync --extra dev --frozen
      - name: Run tests
        working-directory: packages/mcp-server
        run: uv run pytest tests/ -v

  production-preflight:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, mcp-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Read-only owner and infrastructure preflight
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          MEDIA_MODE: ${{ inputs.media_mode }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          scp "${ssh_opts[@]}" scripts/single-user-preflight.sh \
            "${USER}@${HOST}:/tmp/wai-single-user-preflight.sh"
          ssh "${ssh_opts[@]}" "${USER}@${HOST}" bash -s -- \
            "$DEPLOYMENT_MODE" "$MEDIA_MODE" << 'EOF'
          set -euo pipefail
          DEPLOYMENT_MODE=$1
          MEDIA_MODE=$2
          trap 'rm -f /tmp/wai-single-user-preflight.sh' EXIT
          chmod 0700 /tmp/wai-single-user-preflight.sh
          /tmp/wai-single-user-preflight.sh \
            --mode "$DEPLOYMENT_MODE" --media-mode "$MEDIA_MODE"
          EOF

  deploy:
    runs-on: ubuntu-latest
    needs: [production-preflight]
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Prepare infrastructure and immutable release directory
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          MEDIA_MODE: ${{ inputs.media_mode }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          ssh "${ssh_opts[@]}" "${USER}@${HOST}" bash -s -- \
            "$RELEASE_SHA" "$MEDIA_MODE" << 'EOF'
          set -euo pipefail
          RELEASE_SHA=$1
          MEDIA_MODE=$2
          command -v apt-get >/dev/null
          if ! command -v ffmpeg >/dev/null || ! command -v pdfinfo >/dev/null \
            || ! command -v pg_restore >/dev/null || ! command -v gpg >/dev/null \
            || ! command -v curl >/dev/null || ! command -v bzip2 >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              ffmpeg poppler-utils postgresql-client gnupg curl bzip2 ca-certificates
          fi
          id wai >/dev/null
          test -x /home/wai/.local/bin/uv
          getent group wai-media >/dev/null || groupadd --system wai-media
          id wai-bot-api >/dev/null 2>&1 || useradd --system --no-create-home \
            --home-dir /nonexistent --shell /usr/sbin/nologin --gid wai-media wai-bot-api
          usermod -a -G wai-media wai
          # nginx serves cached originals through an internal
          # X-Accel-Redirect, so its workers need to traverse the 0770
          # media root. Without this every download answers 403.
          usermod -a -G wai-media www-data
          cpu_count=$(nproc)
          memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          install -d -o root -g wai-media -m 0770 /srv/wai-telegram-media
          if [ "$MEDIA_MODE" = "full" ]; then
            # Mirrors scripts/single-user-preflight.sh: the volume, the larger box
            # and the off-host backups exist because video, audio and documents are
            # fetched and retained. A speech-only deployment keeps nothing, so it is
            # held to the deferred-release floor instead.
            transcription_types=$(sed -n 's/^MEDIA_TRANSCRIPTION_TYPES=//p' \
              /opt/wai-telegram/.env.production | tail -n 1)
            case ",${transcription_types:-voice,video_note,audio,video}," in
              *,audio,*|*,video,*) speech_only=false ;;
              *) speech_only=true ;;
            esac
            if [ "$speech_only" = true ]; then
              media_free=$(df --output=avail -B1 /srv/wai-telegram-media | tail -n 1)
              [ "$cpu_count" -ge 2 ] && [ "$memory_kib" -ge 3500000 ] \
                && [ "$media_free" -ge 5000000000 ] || {
                echo "Speech-only media mode needs 2 CPU, 3.5 GB RAM, and 5 GB free" >&2
                exit 1
              }
            else
              [ "$cpu_count" -ge 4 ] && [ "$memory_kib" -ge 7500000 ] || {
                echo "Server must be upgraded to at least 4 CPU / 8 GB RAM" >&2
                exit 1
              }
              mountpoint -q /srv/wai-telegram-media
              media_bytes=$(df --output=size -B1 /srv/wai-telegram-media | tail -n 1)
              [ "$media_bytes" -ge 450000000000 ] || {
                echo "Media volume is smaller than the required 500 GB class" >&2
                exit 1
              }
              test -r /etc/wai-telegram/restic.env
              test -r /etc/wai-telegram/restic-password
            fi
            install -d -o wai-bot-api -g wai-media -m 0770 \
              /srv/wai-telegram-media/bot-api /srv/wai-telegram-media/bot-api-temp
          else
            free_bytes=$(df --output=avail -B1 / | tail -n 1)
            [ "$cpu_count" -ge 2 ] && [ "$memory_kib" -ge 3500000 ] \
              && [ "$free_bytes" -ge 8000000000 ] || {
              echo "Deferred release needs 2 CPU, 3.5 GB RAM, and 8 GB free" >&2
              exit 1
            }
          fi
          test -r /etc/wai-telegram/auth-backup-passphrase
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); process.exit(major > 20 || (major === 20 && minor >= 9) ? 0 : 1)'
          release_dir="/opt/wai-telegram-releases/release-$RELEASE_SHA"
          install -d -o root -g root -m 0755 /opt/wai-telegram-releases
          if [ -e "$release_dir" ]; then
            mv "$release_dir" "/opt/wai-telegram-releases/failed-$RELEASE_SHA-$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          install -d -o root -g root -m 0755 "$release_dir"
          EOF

      - name: Upload release source
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude '.git' --exclude 'node_modules' --exclude '.venv' \
            --exclude '__pycache__' --exclude '.next' --exclude '*.pyc' \
            --exclude '.DS_Store' --exclude '.env.production' --exclude '.env' \
            ./ "${USER}@${HOST}:/opt/wai-telegram-releases/release-${RELEASE_SHA}/"

      - name: Build and verify release before downtime
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          MEDIA_MODE: ${{ inputs.media_mode }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          ssh "${ssh_opts[@]}" "${USER}@${HOST}" bash -s -- \
            "$RELEASE_SHA" "$MEDIA_MODE" << 'EOF'
          set -euo pipefail
          RELEASE_SHA=$1
          MEDIA_MODE=$2
          release_dir="/opt/wai-telegram-releases/release-$RELEASE_SHA"
          chown -R root:root "$release_dir"
          install -d -o wai -g wai -m 0755 "$release_dir/.venv"
          chown -R wai:wai "$release_dir/packages/backend" \
            "$release_dir/packages/mcp-server" "$release_dir/packages/frontend"
          install -o root -g wai -m 0640 /opt/wai-telegram/.env.production \
            "$release_dir/.env.production"
          set -a
          source "$release_dir/.env.production"
          set +a
          for variable in DATABASE_URL REDIS_URL OWNER_USER_ID SECRET_KEY \
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY NEXT_PUBLIC_API_URL SENTRY_DSN \
            OPENAI_API_KEY DEEPGRAM_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_API_ID \
            TELEGRAM_API_HASH MEDIA_PIPELINE_ENABLED TELEGRAM_BOT_API_BASE_URL; do
            test -n "${!variable:-}" || { echo "Missing $variable" >&2; exit 1; }
          done
          if [ "$MEDIA_MODE" = "full" ]; then
            [ "$MEDIA_PIPELINE_ENABLED" = "true" ] || exit 1
            install -d -o root -g wai-media -m 0750 /etc/wai-telegram
            # restic protects media retained on the media path. A speech-only
            # deployment deletes each file once its text is extracted, so there is
            # nothing there to protect and no reason to hold repository credentials.
            transcription_types=$(sed -n 's/^MEDIA_TRANSCRIPTION_TYPES=//p' \
              /opt/wai-telegram/.env.production | tail -n 1)
            case ",${transcription_types:-voice,video_note,audio,video}," in
              *,audio,*|*,video,*)
                "$release_dir/scripts/install-restic.sh"
                "$release_dir/scripts/restic-init.sh"
                ;;
            esac
          else
            [ "$MEDIA_PIPELINE_ENABLED" = "false" ] || exit 1
          fi
          runuser -u wai -- /home/wai/.local/bin/uv sync \
            --directory "$release_dir" --all-packages --no-dev --frozen
          runuser -u wai -- bash -c \
            "cd '$release_dir/packages/frontend' && set -a && source '$release_dir/.env.production' && set +a && npm ci --prefer-offline && npm run build"
          test -x "$release_dir/.venv/bin/python"
          test -f "$release_dir/packages/frontend/.next/BUILD_ID"
          EOF

      - name: Create verified encrypted backup and optional off-host media backup
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          MEDIA_MODE: ${{ inputs.media_mode }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          scp "${ssh_opts[@]}" scripts/auth-cutover-backup.sh scripts/restic-backup.sh \
            "${USER}@${HOST}:/tmp/"
          ssh "${ssh_opts[@]}" "${USER}@${HOST}" bash -s -- "$MEDIA_MODE" << 'EOF'
          set -euo pipefail
          MEDIA_MODE=$1
          trap 'rm -f /tmp/auth-cutover-backup.sh /tmp/restic-backup.sh' EXIT
          chmod 0700 /tmp/auth-cutover-backup.sh /tmp/restic-backup.sh
          /tmp/auth-cutover-backup.sh
          transcription_types=$(sed -n 's/^MEDIA_TRANSCRIPTION_TYPES=//p' \
            /opt/wai-telegram/.env.production | tail -n 1)
          case ",${transcription_types:-voice,video_note,audio,video}," in
            *,audio,*|*,video,*) retains_media=true ;;
            *) retains_media=false ;;
          esac
          if [ "$MEDIA_MODE" = "full" ] && [ "$retains_media" = true ]; then
            /tmp/restic-backup.sh
          elif [ "$MEDIA_MODE" = "full" ]; then
            echo "Speech-only media mode: nothing is retained on the media path to back up"
          else
            echo "Deferred media mode: off-host media backup is intentionally pending"
          fi
          EOF

      - name: Activate release, migrate, cut over, and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          MEDIA_MODE: ${{ inputs.media_mode }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          ssh "${ssh_opts[@]}" "${USER}@${HOST}" bash -s -- \
            "$RELEASE_SHA" "$DEPLOYMENT_MODE" "$MEDIA_MODE" << 'EOF'
          set -euo pipefail
          RELEASE_SHA=$1
          DEPLOYMENT_MODE=$2
          MEDIA_MODE=$3
          core_services="wai-backend wai-celery wai-celery-beat wai-listener wai-mcp-sse wai-frontend"
          media_services="wai-media wai-media-process wai-media-index"
          all_services="$core_services $media_services"
          release_dir="/opt/wai-telegram-releases/release-$RELEASE_SHA"
          previous_target=$(readlink -f /opt/wai-telegram)
          migration_started=0
          rollback_or_fail_closed() {
            status=$?
            [ "$status" -eq 0 ] && return
            systemctl stop $all_services >/dev/null 2>&1 || true
            if [ "$migration_started" -eq 0 ]; then
              rm -f -- /opt/wai-telegram
              ln -s "$previous_target" /opt/wai-telegram
              systemctl daemon-reload
              systemctl start $core_services wai-media >/dev/null 2>&1 || true
              echo "Activation failed before migration; previous release restored" >&2
            else
              echo "Activation failed after migration began; services remain stopped for fail-safe recovery" >&2
            fi
            exit "$status"
          }
          trap rollback_or_fail_closed EXIT
          for service in $all_services; do
            systemctl stop "$service" >/dev/null 2>&1 || true
          done
          if [ ! -L /opt/wai-telegram ]; then
            legacy="/opt/wai-telegram-releases/legacy-$(date -u +%Y%m%dT%H%M%SZ)"
            mv /opt/wai-telegram "$legacy"
            previous_target="$legacy"
          else
            rm -f -- /opt/wai-telegram
          fi
          ln -s "$release_dir" /opt/wai-telegram
          # Container limits and Postgres flags live in docker-compose.prod.yml,
          # but nothing ever applied them: the file said 1536M while the box ran
          # 2200M, set by hand after a backup died. Reconcile here, with the
          # services already stopped. Compose is a no-op when nothing changed.
          (
            set -a
            source /opt/wai-telegram/.env.production
            set +a
            docker compose -f /opt/wai-telegram/docker-compose.prod.yml up -d \
              postgres redis
          )
          for _ in $(seq 1 30); do
            docker exec wai-telegram-db pg_isready -U telegram >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec wai-telegram-db pg_isready -U telegram >/dev/null
          migration_started=1
          runuser -u wai -- bash -c \
            'cd /opt/wai-telegram/packages/backend && set -a && source /opt/wai-telegram/.env.production && set +a && /opt/wai-telegram/.venv/bin/alembic upgrade head'
          set -a
          source /opt/wai-telegram/.env.production
          set +a
          if [ "$DEPLOYMENT_MODE" = "initial-cutover" ]; then
            runuser -u wai -- bash -c \
              'cd /opt/wai-telegram/packages/backend && set -a && source /opt/wai-telegram/.env.production && set +a && /opt/wai-telegram/.venv/bin/python -m app.cli.single_user_cutover --apply --confirm-owner "$OWNER_USER_ID"'
          else
            runuser -u wai -- bash -c \
              'cd /opt/wai-telegram/packages/backend && set -a && source /opt/wai-telegram/.env.production && set +a && /opt/wai-telegram/.venv/bin/python -m app.cli.single_user_validate'
          fi
          for unit in /opt/wai-telegram/systemd/*.service /opt/wai-telegram/systemd/*.timer; do
            install -o root -g root -m 0644 "$unit" /etc/systemd/system/
          done
          install -o root -g root -m 0644 /opt/wai-telegram/nginx/telegram-ai.conf \
            /etc/nginx/sites-available/telegram-ai.conf
          ln -sfn /etc/nginx/sites-available/telegram-ai.conf \
            /etc/nginx/sites-enabled/telegram-ai.conf
          systemctl daemon-reload
          nginx -t
          if [ "$MEDIA_MODE" = "full" ]; then
              systemctl enable $media_services
            # The volume monitor and the restic timers both watch retained media.
            # Speech-only deployments retain none, so leave them off rather than
            # scheduling jobs that would run against an empty directory.
            transcription_types=$(sed -n 's/^MEDIA_TRANSCRIPTION_TYPES=//p' \
              /opt/wai-telegram/.env.production | tail -n 1)
            case ",${transcription_types:-voice,video_note,audio,video}," in
              *,audio,*|*,video,*)
                systemctl enable --now wai-media-volume-monitor.timer \
                  wai-restic-backup.timer wai-restic-check.timer \
                  wai-restic-restore-drill.timer
                ;;
            esac
            systemctl enable --now wai-media-cache-prune.timer
            systemctl restart $core_services $media_services
          else
            systemctl disable --now $media_services \
              wai-media-cache-prune.timer \
              wai-media-volume-monitor.timer wai-restic-backup.timer \
              wai-restic-check.timer wai-restic-restore-drill.timer \
              >/dev/null 2>&1 || true
            systemctl restart $core_services
          fi
          systemctl reload nginx
          for attempt in $(seq 1 12); do
            if systemctl is-active --quiet $core_services \
              && curl -sf --max-time 10 http://127.0.0.1:8000/health/ready >/dev/null; then
              if [ "$MEDIA_MODE" = "deferred" ] \
                || systemctl is-active --quiet $media_services; then
                break
              fi
            fi
            [ "$attempt" -eq 12 ] && exit 1
            sleep 10
          done
          # A broadcast sent before workers subscribe is lost; resend during startup.
          celery_ready=0
          for attempt in 1 2 3; do
            if celery_ping_output=$(runuser -u wai -- bash -c \
              'cd /opt/wai-telegram/packages/backend && set -a && source /opt/wai-telegram/.env.production && set +a && /opt/wai-telegram/.venv/bin/celery -A app.tasks.celery_app:celery_app inspect ping --timeout=30') \
              && [[ "$celery_ping_output" == *pong* ]]; then
              celery_ready=1
              break
            fi
            [ "$attempt" -eq 3 ] || sleep 2
          done
          [ "$celery_ready" -eq 1 ]
          migration_started=2
          trap - EXIT
          EOF

      - name: Verify public health and protected MCP
        run: |
          for attempt in $(seq 1 6); do
            if curl -sf --max-time 10 https://telegram.waiwai.is/health/ready >/dev/null; then
              break
            fi
            [ "$attempt" -eq 6 ] && exit 1
            sleep 10
          done
          status=$(curl -sS -o /tmp/mcp_probe.out -w '%{http_code}' https://telegram.waiwai.is/mcp)
          [ "$status" = "401" ] || {
            echo "Expected MCP authentication challenge, got HTTP $status" >&2
            exit 1
          }

      - name: Start checkpointed post-deploy reconciliation
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          MEDIA_MODE: ${{ inputs.media_mode }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          ssh "${ssh_opts[@]}" "${USER}@${HOST}" bash -s -- "$MEDIA_MODE" << 'EOF'
          set -euo pipefail
          if [ "$1" = "full" ]; then
            systemctl start --no-block wai-search-indexes.service
            systemctl start --no-block wai-metadata-reconcile.service
          else
            echo "Deferred media mode: reconciliation waits for expanded resources"
          fi
